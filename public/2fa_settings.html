<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Super Sistemas - Configurações 2FA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light min-vh-100 d-flex flex-column">
  <div id="menu"></div>
  
  <main id="principal" class="container-fluid flex-fill d-flex align-items-center justify-content-center">
    <div class="card shadow p-4" style="max-width: 600px; width: 100%;">
      <h2 class="text-center mb-4">Configurações de Autenticação de Dois Fatores (2FA)</h2>
      <div id="statusMessage" class="mt-3"></div>

      <div id="statusContainer">
        <p id="currentStatus"></p>
        <button id="toggle2FAButton" class="btn btn-primary"></button>
      </div>

      <div id="setupContainer" style="display:none;">
        <hr>
        <h4>Passo 1: Configure seu Aplicativo Autenticador</h4>
        <p>Escaneie o código QR abaixo com seu aplicativo autenticador (ex: Google Authenticator, Authy).</p>
        <div class="text-center mb-3">
          <img id="qrCodeImage" src="" alt="QR Code 2FA" class="img-fluid border p-2" style="max-width: 250px;">
        </div>
        <p>Ou insira o segredo manualmente: <code id="secretCode"></code></p>

        <h4>Passo 2: Verifique o Código</h4>
        <form id="verifyForm">
          <div class="mb-3">
            <label for="verificationCode" class="form-label">Código de Verificação (6 dígitos)</label>
            <input type="text" class="form-control" id="verificationCode" maxlength="6" required>
          </div>
          <button type="submit" class="btn btn-success">Ativar 2FA</button>
          <button type="button" class="btn btn-secondary" onclick="cancelSetup()">Cancelar</button>
        </form>
      </div>
    </div>
  </main>

  <div id="rodape"></div>

  <script>
    fetch('/menu.html').then(r => r.text()).then(h => document.getElementById('menu').innerHTML = h);
    fetch('/rodape.html').then(r => r.text()).then(h => document.getElementById('rodape').innerHTML = h);

    const statusMessage = document.getElementById('statusMessage');
    const currentStatus = document.getElementById('currentStatus');
    const toggle2FAButton = document.getElementById('toggle2FAButton');
    const setupContainer = document.getElementById('setupContainer');
    const qrCodeImage = document.getElementById('qrCodeImage');
    const secretCode = document.getElementById('secretCode');
    const verifyForm = document.getElementById('verifyForm');

    async function fetchStatus() {
      try {
        const response = await fetch('/api/2fa/status');
        const data = await response.json();

        if (data.sucesso) {
          if (data.twoFactorEnabled) {
            currentStatus.innerHTML = '<strong>Status:</strong> Ativado';
            toggle2FAButton.textContent = 'Desativar 2FA';
            toggle2FAButton.className = 'btn btn-danger';
            toggle2FAButton.onclick = disable2FA;
            setupContainer.style.display = 'none';
          } else {
            currentStatus.innerHTML = '<strong>Status:</strong> Desativado';
            toggle2FAButton.textContent = 'Configurar 2FA';
            toggle2FAButton.className = 'btn btn-primary';
            toggle2FAButton.onclick = startSetup;
            setupContainer.style.display = 'none';
          }
        } else {
          statusMessage.innerHTML = `<div class="alert alert-danger">Erro ao carregar status: ${data.mensagem}</div>`;
        }
      } catch (error) {
        console.error('Erro:', error);
        statusMessage.innerHTML = '<div class="alert alert-danger">Erro ao conectar com o servidor.</div>';
      }
    }

    async function startSetup() {
      statusMessage.innerHTML = '';
      try {
        const response = await fetch('/api/2fa/setup', { method: 'POST' });
        const data = await response.json();

        if (data.sucesso) {
          qrCodeImage.src = data.qrCodeUrl;
          secretCode.textContent = data.secret;
          setupContainer.style.display = 'block';
          statusMessage.innerHTML = '<div class="alert alert-info">Configuração iniciada. Siga os passos abaixo. Lembre-se que o código de teste está no console do servidor.</div>';
        } else {
          statusMessage.innerHTML = `<div class="alert alert-danger">Erro ao iniciar configuração: ${data.mensagem}</div>`;
        }
      } catch (error) {
        console.error('Erro:', error);
        statusMessage.innerHTML = '<div class="alert alert-danger">Erro ao conectar com o servidor para iniciar a configuração.</div>';
      }
    }

    function cancelSetup() {
      setupContainer.style.display = 'none';
      statusMessage.innerHTML = '';
      fetchStatus(); // Recarrega o status
    }

    verifyForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusMessage.innerHTML = '';
      const token = document.getElementById('verificationCode').value;

      try {
        const response = await fetch('/api/2fa/verify-and-enable', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        });
        const data = await response.json();

        if (data.sucesso) {
          statusMessage.innerHTML = `<div class="alert alert-success">${data.mensagem}</div>`;
          setupContainer.style.display = 'none';
          fetchStatus();
        } else {
          statusMessage.innerHTML = `<div class="alert alert-danger">${data.mensagem}</div>`;
        }
      } catch (error) {
        console.error('Erro:', error);
        statusMessage.innerHTML = '<div class="alert alert-danger">Erro ao conectar com o servidor para verificar o código.</div>';
      }
    });

    async function disable2FA() {
      if (!confirm('Tem certeza que deseja desativar a Autenticação de Dois Fatores?')) {
        return;
      }
      statusMessage.innerHTML = '';
      try {
        const response = await fetch('/api/2fa/disable', { method: 'POST' });
        const data = await response.json();

        if (data.sucesso) {
          statusMessage.innerHTML = `<div class="alert alert-success">${data.mensagem}</div>`;
          fetchStatus();
        } else {
          statusMessage.innerHTML = `<div class="alert alert-danger">${data.mensagem}</div>`;
        }
      } catch (error) {
        console.error('Erro:', error);
        statusMessage.innerHTML = '<div class="alert alert-danger">Erro ao conectar com o servidor para desativar o 2FA.</div>';
      }
    }

    // Inicializa o status
    fetchStatus();
  </script>
</body>
</html>
